# Sample nginx site for a server where the bot sits behind another nginx (the host's), which takes the client address
# from Cloudflare and sends only that address in X-Forwarded-For. Install:
#
#   sudo cp tools/nginx-sanakan.conf /etc/nginx/sites-available/sanakan
#   sudo nano /etc/nginx/sites-available/sanakan        # fill in the values below, every <...>
#   sudo ln -s /etc/nginx/sites-available/sanakan /etc/nginx/sites-enabled/sanakan
#   sudo rm /etc/nginx/sites-enabled/default            # it is a default_server too
#   sudo nginx -t && sudo systemctl reload nginx
#
#   <HOST_NGINX_ADDRESS>  the host's address as this server sees it; only its X-Forwarded-For is believed
#   <GOUT>                the folder GOut links to (install-service.sh --data), e.g. /data/sanakan-GOut
#   <CDN_NAMES>           the names the cards are linked under, separated by spaces
#   <API_NAMES>           the names of the bot's API, separated by spaces
#
# nginx (www-data) has to be able to read <GOUT>/Cards, the bot creates the files readable for everyone.

# a missing card exists a moment later, so its 404 or 503 must not stay in a cache (Cloudflare keeps image 404s for
# minutes); an empty value adds no header, so the cards themselves keep their caching
map $status $sanakan_cdn_cache_control {
    ~^[45] "no-store";
    default "";
}

# other names and the bare address get no answer
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

# generated cards only: the players' own pictures in <GOUT>/Saved are never served (root is <GOUT>/Cards)
server {
    listen 80;
    server_name <CDN_NAMES>;
    server_tokens off;
    set_real_ip_from <HOST_NGINX_ADDRESS>;
    real_ip_header X-Forwarded-For;
    # the host's nginx logs these requests already, here they would only fill the disk
    access_log off;
    add_header Cache-Control $sanakan_cdn_cache_control always;

    # the links use small/profile/prof and the folders are Small/Profile/Prof; the letter case does not matter
    root <GOUT>/Cards;
    location ~* "^/(\d+\.(?:webp|gif))$" { try_files /$1 @card; }
    location ~* "^/small/(\d+\.(?:webp|gif))$" { try_files /Small/$1 @card; }
    location ~* "^/profile/(\d+\.(?:webp|gif))$" { try_files /Profile/$1 @card; }
    location ~* "^/prof/(\d+\.webp)$" { try_files /Prof/$1 =404; }
    location / { return 404; }

    # a card without its picture: the bot draws it and sends it back (503 with Retry-After while it is still
    # drawing, 404 for a card that does not exist); later requests get the file. When the bot finds the picture
    # under the other extension, it redirects there.
    location @card {
        rewrite "(?i)^/(\d+)\.\w+$" /api/waifu/card/$1?type=Normal? break;
        rewrite "(?i)^/small/(\d+)\.\w+$" /api/waifu/card/$1?type=Small? break;
        rewrite "(?i)^/profile/(\d+)\.\w+$" /api/waifu/card/$1?type=Profile? break;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

# the bot's API; Kestrel listens only on the loopback
server {
    listen 80;
    server_name <API_NAMES>;
    server_tokens off;
    set_real_ip_from <HOST_NGINX_ADDRESS>;
    real_ip_header X-Forwarded-For;
    # Kestrel's own limit
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # the client's address only, the bot trusts X-Forwarded-For from 127.0.0.1 and limits token attempts by it
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
